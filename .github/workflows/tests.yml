name: Train matrix tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/yard_matrix.test.js
      - run: node experiments/bench.js
      - name: Check reproducible results
        run: git diff --exit-code -- results.json
